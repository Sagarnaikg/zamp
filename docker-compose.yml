# Optional convenience: a one-command local Postgres. DATABASE_URL can just as
# easily point at any other Postgres instance — Docker isn't required.
#   docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zamp
      POSTGRES_PASSWORD: zamp
      POSTGRES_DB: zamp_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
