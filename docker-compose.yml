# One-command local Postgres for running the project without any accounts:
#   docker compose up -d
# Matches the DATABASE_URL default in .env.example.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zamp
      POSTGRES_PASSWORD: zamp
      POSTGRES_DB: zamp_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
